[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-lab"
version = "0.4.0"
description = "Phase 4A — Historical dataset pipeline + Phase 3 research lab + Phase 2 Data Engine (no live trading)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Francisco Castillo" }]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "click>=8.1",
  "httpx>=0.27",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
crypto-lab = "crypto_lab.cli:main"

[tool.setuptools.packages.find]
include = ["crypto_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: hits public network or heavier paths",
  "live: live public REST (set RUN_LIVE_DATA_TESTS=1)",
]
